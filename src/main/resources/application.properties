# ===== PRAXIS - configuración =====
quarkus.application.name=praxis
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# La API vive bajo /api para que Quinoa sirva el frontend en el resto de rutas
quarkus.rest.path=/api
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.timezone=America/Guayaquil
quarkus.hibernate-orm.jdbc.timezone=America/Guayaquil

# ----- Base de datos (variables de entorno en producción) -----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/praxis}
quarkus.datasource.username=${DB_USER:praxis}
quarkus.datasource.password=${DB_PASSWORD:praxis}
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.devservices.image-name=postgres:17-alpine
# El esquema lo gobierna Flyway; Hibernate nunca lo modifica
quarkus.hibernate-orm.database.generation=none

# ----- Flyway -----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/seed
# En producción NO se carga la semilla de desarrollo

# ----- OpenAPI / salud -----
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true

# ----- Quinoa (React/Vite) -----
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.12.0
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q

# ----- Logs -----
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{idCorrelacion}] %c{1.} - %s%e%n

# ----- Pruebas -----
%test.quarkus.flyway.locations=db/migration
%test.quarkus.quinoa.enable=false


# ----- Seguridad Incremento 1 -----
mp.jwt.verify.issuer=praxis
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
praxis.jwt.duracion-segundos=${JWT_DURACION_SEGUNDOS:3600}
praxis.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
praxis.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

# Administrador inicial
praxis.admin.correo=${ADMIN_CORREO:}
praxis.admin.password=${ADMIN_PASSWORD:}


# Claves efímeras exclusivas para pruebas automatizadas; nunca usar en producción.
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.praxis.admin.correo=admin@praxis.test
%test.praxis.admin.password=ClavePruebasSegura123


quarkus.hibernate-orm.mapping.format.global=ignore