services:
  - type: web
    name: praxis
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY_LOCATION
        value: /etc/secrets/privateKey.pem
      - key: JWT_PUBLIC_KEY_LOCATION
        value: /etc/secrets/publicKey.pem
      - key: JWT_DURACION_SEGUNDOS
        value: "3600"
      - key: LOGIN_MAX_INTENTOS
        value: "5"
      - key: LOGIN_BLOQUEO_MINUTOS
        value: "15"
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ
        value: America/Guayaquil
